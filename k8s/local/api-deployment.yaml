apiVersion: apps/v1
kind: Deployment
metadata:
  name: partflow-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: partflow-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: partflow-api
        app.kubernetes.io/part-of: partflow
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - until pg_isready -h partflow-postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: partflow-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: partflow-config
                  key: POSTGRES_USER
      containers:
        - name: api
          image: partflow-api:k8s-local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: partflow-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: partflow-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: partflow-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: partflow-db-secret
                  key: POSTGRES_PASSWORD
            - name: ConnectionStrings__PartFlowDb
              value: Host=partflow-postgres;Port=5432;Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD)
          readinessProbe:
            httpGet:
              path: /api/parts
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
